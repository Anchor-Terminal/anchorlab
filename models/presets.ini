; models/presets.ini: the models llama-server serves for the lab, in router mode (MODELS.md).
; models/install.sh puts this in /etc/llama/models.ini with @MODELS@ replaced by the models folder.
; A section's name is the model's name: what ANCHOR_LAB_MODEL and `anchor-lab bench -model` ask for.
; The router loads the one asked for and unloads the last (--models-max 1 in the unit).
;
; Sampling is each publisher's recommendation, from their model cards on 17 and 18 November 2026. The
; harness sends no temperature unless told to, so these apply. Keys are llama-server's flags
; without the dashes.
version = 1

[*]
; the lab asks one thing at a time: one slot, all of it on the GPU, and a context whose size the
; harness knows (ANCHOR_LAB_CONTEXT, 65,536 unless set). A conversation that would outgrow it is
; sent with its oldest tool output cut short, so give no model less than the harness expects.
np = 1
ngl = all
c = 65536
jinja = true
; thinking counts against the harness's 16,384-token reply, so a model that thinks stops thinking
; at 8,192 and has the rest for the program or the answer. Raise the two together, this and
; -max-tokens on the harness.
reasoning-budget = 8192

[qwen3.8-27b]
model = @MODELS@/qwen/qwen3.8-27b/Qwen3.8-27B-Q8_0.gguf
; thinking mode: temperature 1.0, top_p 0.95, top_k 20, min_p 0, presence_penalty 0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
; xhigh is its default; medium answers in a lab reply's length
reasoning-effort = medium

[qwen3.5-122b-a10b]
; two files; llama.cpp finds the second from the first
model = @MODELS@/qwen/qwen3.5-122b-a10b/Qwen3.5-122B-A10B-Q4_K_M-00001-of-00002.gguf
; thinking mode, general tasks
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5

