; models/presets.ini: the models llama-server serves for the lab, in router mode (MODELS.md).
; models/install.sh puts this in /etc/llama/models.ini with @MODELS@ replaced by the models folder.
; A section's name is the model's name: what ANCHOR_LAB_MODEL and `anchor-lab bench -model` ask for.
; The router loads the one asked for and unloads the last (--models-max 1 in the unit).
;
; Sampling is each publisher's recommendation, from their model cards on 17 November 2026. The
; harness sends no temperature unless told to, so these apply. Keys are llama-server's flags
; without the dashes.
version = 1

[*]
; the lab asks one thing at a time: one slot, all of it on the GPU, a context long enough for an
; explore conversation (six replies of up to 4,096 tokens and the programs' output)
np = 1
ngl = all
c = 65536
jinja = true
; thinking counts against the harness's 4,096-token reply, so a model that thinks stops thinking at
; 2,048 and has the rest for the program. Raise it with -max-tokens on the harness.
reasoning-budget = 2048

[qwen3.8-27b]
model = @MODELS@/qwen/qwen3.8-27b/Qwen3.8-27B-Q4_K_M.gguf
; thinking mode: temperature 1.0, top_p 0.95, top_k 20, min_p 0, presence_penalty 0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
; xhigh is its default; medium answers in a lab reply's length
reasoning-effort = medium

[qwen3.6-27b]
model = @MODELS@/qwen/qwen3.6-27b/Qwen3.6-27B-Q4_K_M.gguf
; thinking mode, general tasks
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0

[qwen3.5-122b-a10b]
; two files; llama.cpp finds the second from the first
model = @MODELS@/qwen/qwen3.5-122b-a10b/Qwen3.5-122B-A10B-Q4_K_M-00001-of-00002.gguf
; thinking mode, general tasks
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5

[gemma-4-31b]
model = @MODELS@/google/gemma-4-31b/gemma-4-31B_q4_0-it.gguf
; one setting for everything: temperature 1.0, top_p 0.95, top_k 64. Thinking is off unless asked for.
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[gemma-4-26b-a4b]
model = @MODELS@/google/gemma-4-26b-a4b/gemma-4-26B_q4_0-it.gguf
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[glm-4.7-flash]
model = @MODELS@/zai/glm-4.7-flash/GLM-4.7-Flash-Q8_0.gguf
; its default for most tasks: temperature 1.0, top_p 0.95 (0.7 and 1.0 for its terminal and SWE runs)
temp = 1.0
top-p = 0.95
min-p = 0.0

[qwen3.6-35b-a3b]
model = @MODELS@/qwen/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-Q8_0.gguf
; thinking mode, general tasks
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5

[gpt-oss-120b]
model = @MODELS@/openai/gpt-oss-120b/gpt-oss-120b-MXFP4.gguf
; OpenAI: temperature 1.0, top_p 1.0
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
; low, medium or high
reasoning-effort = medium
