; ---- Variants: qwen3.8-27b with one thing changed, for the evaluation to compare (MODELS.md,
; "Variants"). Each has the publisher's sampling above unless its name says otherwise, so a
; difference in the score is the thing named.

[qwen3.8-27b+q4]
; the 4-bit build of the same model
model = @MODELS@/qwen/qwen3.8-27b/Qwen3.8-27B-Q4_K_M.gguf
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
reasoning-effort = medium

[qwen3.8-27b+mtp]
; speculative decoding with Qwen's own multi-token prediction heads
